# Lua-era note: `hyprctl dispatch <arg>` evaluates <arg> as Lua
# (`hl.dispatch(<arg>)`), and `hl.dsp.dpms()` reads its action only from a
# table field — a bare string silently means "toggle". Hence the table form.

general {
  lock_cmd = pidof hyprlock || hyprlock          # lock on loginctl Lock (lock-session)
  before_sleep_cmd = pidof hyprlock || hyprlock  # lock before suspend
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' # display back on after wake
  ignore_dbus_inhibit = false                    # respect inhibitors (firefox/steam)
  ignore_systemd_inhibit = false                 # respect systemd-inhibit --what=idle
}

# 2min — dim the backlight; restored on activity
listener {
  timeout = 120
  on-timeout = brightnessctl -s set 10%
  on-resume = brightnessctl -r
}

# 10 min — lock
listener {
  timeout = 600
  on-timeout = pidof hyprlock || hyprlock
}

# 15 min — display off; back on with activity (session stays locked)
listener {
  timeout = 900
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2 h — suspend (locks first via before_sleep_cmd; display back on via after_sleep_cmd)
listener {
  timeout = 7200
  on-timeout = systemctl suspend
}
