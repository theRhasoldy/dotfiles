# ~/.config/hypr/hyprlock.conf — Tahoe lock screen
# Palette from rofi/tahoe.rasi: text #eeeeee, teal #31E2CC, red #FF453A
# Fonts prioritize SF Pro Display; Avenir is the fallback until it is installed
# (pango family list: SF Pro Display, Avenir / ...Avenir Medium → weight 500)

$fontBody  = SF Pro Display, Avenir
$fontClock = SF Pro Display, Avenir Medium

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    noise = 0.02
    brightness = 0.75
}

# TIME (24h, updates every second)
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $fontClock
    color = rgb(238, 238, 238)

    position = 0, 210
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 26
    font_family = $fontBody
    color = rgba(238, 238, 238, 0.75)

    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 52
    outline_thickness = 2
    rounding = 12

    inner_color = rgba(26, 26, 26, 0.6)
    outer_color = rgba(255, 255, 255, 0.12)
    check_color = rgba(49, 226, 204, 1.0)
    fail_color = rgba(255, 69, 58, 1.0)

    font_family = $fontBody
    font_size = 11
    font_color = rgb(238, 238, 238)
    placeholder_text = Enter Password
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3
    fade_on_empty = false

    position = 0, -10
    halign = center
    valign = center
}

# keyboard layout indicator (click to switch)
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 11
    font_family = $fontBody
    color = rgba(238, 238, 238, 0.5)
    onclick = hyprctl switchxkblayout all next

    position = 0, -100
    halign = center
    valign = center
}
